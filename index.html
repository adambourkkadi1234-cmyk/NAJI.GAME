
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>الناجي - آخر ليلة</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#101a16;
font-family:Arial,sans-serif;touch-action:none}
#hud{position:fixed;top:12px;right:12px;z-index:2;
color:white;background:#10251ddd;padding:12px;
border:1px solid #66846b;border-radius:12px}
#health{color:#ff6868;font-weight:bold}
#help{position:fixed;top:12px;left:12px;color:white;
background:#10251ddd;padding:10px;border-radius:10px;
font-size:13px;z-index:2}
#joy{position:fixed;bottom:24px;left:24px;width:120px;
height:120px;border-radius:50%;background:#ffffff30;
border:2px solid #ffffff99;z-index:3;touch-action:none}
#stick{position:absolute;left:35px;top:35px;width:46px;
height:46px;border-radius:50%;background:#ffffffbb}
#attack{position:fixed;bottom:42px;right:28px;
width:88px;height:88px;border-radius:50%;
background:#b92f28;color:white;border:3px solid #ffaaa0;
font-size:17px;font-weight:bold;z-index:3;touch-action:none}
#msg{position:fixed;inset:0;display:none;place-items:center;
background:#000b;color:white;z-index:5;text-align:center}
#msg button{padding:12px 24px;border:0;border-radius:10px;
font-size:18px;margin-top:12px}
</style>
</head>
<body>
<div id="hud">
  <b>🧟 الناجي: آخر ليلة</b><br>
  ❤️ الحياة: <span id="health">100</span>%<br>
  ☠️ الزومبي: <span id="count">5</span><br>
  ⭐ النقط: <span id="score">0</span>
</div>
<div id="help">تحرك واهرب من الزومبي!</div>
<div id="joy"><div id="stick"></div></div>
<button id="attack">دافع!</button>
<div id="msg">
  <div>
    <h1 id="result">سالات اللعبة!</h1>
    <p>النقط ديالك: <span id="finalScore">0</span></p>
    <button onclick="location.reload()">عاود اللعب</button>
  </div>
</div>

<script type="module">
import * as THREE from
 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x879c9b);
scene.fog = new THREE.Fog(0x879c9b, 25, 85);

const camera = new THREE.PerspectiveCamera(
  65, innerWidth / innerHeight, 0.1, 150
);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xcce4ff,0x304020,2));
const sun = new THREE.DirectionalLight(0xffe3bd,2.5);
sun.position.set(10,20,8);
sun.castShadow = true;
scene.add(sun);

// الأرض
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(180,180),
  new THREE.MeshStandardMaterial({color:0x526747})
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

// طريق وسط الغابة
const road = new THREE.Mesh(
  new THREE.PlaneGeometry(9,180),
  new THREE.MeshStandardMaterial({color:0x69665b})
);
road.rotation.x=-Math.PI/2;
road.position.y=0.02;
scene.add(road);

// صناعة شجرة
function tree(x,z){
  const trunk=new THREE.Mesh(
    new THREE.CylinderGeometry(.18,.3,2,7),
    new THREE.MeshStandardMaterial({color:0x69452c})
  );
  trunk.position.set(x,1,z);
  scene.add(trunk);

  const leaves=new THREE.Mesh(
    new THREE.ConeGeometry(1.2,3,7),
    new THREE.MeshStandardMaterial({color:0x244c32})
  );
  leaves.position.set(x,3,z);
  scene.add(leaves);
}

for(let i=0;i<100;i++){
  const x=(Math.random()-.5)*100;
  const z=(Math.random()-.5)*100;
  if(Math.abs(x)>7) tree(x,z);
}

// الشخصية
function makePerson(color){
  const group=new THREE.Group();

  const body=new THREE.Mesh(
    new THREE.BoxGeometry(.8,1.1,.5),
    new THREE.MeshStandardMaterial({color})
  );
  body.position.y=1.05;
  body.castShadow=true;
  group.add(body);

  const head=new THREE.Mesh(
    new THREE.SphereGeometry(.32,12,10),
    new THREE.MeshStandardMaterial({color:0xd5ad86})
  );
  head.position.y=1.85;
  head.castShadow=true;
  group.add(head);

  return group;
}

const player=makePerson(0x267bd4);
scene.add(player);
player.position.set(0,0,0);

// الزومبي
const zombies=[];
for(let i=0;i<5;i++){
  const z=makePerson(0x6b9970);
  z.scale.setScalar(1.05);
  z.position.set(
    (Math.random()-.5)*18,
    0,
    -8-Math.random()*15
  );
  scene.add(z);
  zombies.push({mesh:z,attackTimer:0});
}

let health=100, score=0, gameOver=false;
const healthEl=document.querySelector('#health');
const countEl=document.querySelector('#count');
const scoreEl=document.querySelector('#score');

const input={x:0,y:0};
const joy=document.querySelector('#joy');
const stick=document.querySelector('#stick');
let joyPointer=null;

function moveJoy(e){
  const r=joy.getBoundingClientRect();
  let x=e.clientX-(r.left+r.width/2);
  let y=e.clientY-(r.top+r.height/2);
  const len=Math.hypot(x,y);
  if(len>38){x=x/len*38;y=y/len*38}
  input.x=x/38;
  input.y=y/38;
  stick.style.left=(35+x)+'px';
  stick.style.top=(35+y)+'px';
}

joy.addEventListener('pointerdown',e=>{
  joyPointer=e.pointerId;
  joy.setPointerCapture(e.pointerId);
  moveJoy(e);
});
joy.addEventListener('pointermove',e=>{
  if(e.pointerId===joyPointer)moveJoy(e);
});
function releaseJoy(){
  joyPointer=null;
  input.x=0;input.y=0;
  stick.style.left='35px';stick.style.top='35px';
}
joy.addEventListener('pointerup',releaseJoy);
joy.addEventListener('pointercancel',releaseJoy);

// حتى لوحة المفاتيح تخدم فالحاسوب
const keys={};
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

// الدفاع إلا قرب الزومبي
let attackCooldown=0;
document.querySelector('#attack').addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(gameOver||attackCooldown>0)return;
  attackCooldown=.5;

  for(let i=zombies.length-1;i>=0;i--){
    const z=zombies[i];
    if(z.mesh.position.distanceTo(player.position)<3.2){
      scene.remove(z.mesh);
      zombies.splice(i,1);
      score+=10;
      scoreEl.textContent=score;
      countEl.textContent=zombies.length;
      break;
    }
  }
});

const clock=new THREE.Clock();
const direction=new THREE.Vector3();
const target=new THREE.Vector3();

function endGame(){
  gameOver=true;
  document.querySelector('#result').textContent='سالات اللعبة!';
  document.querySelector('#finalScore').textContent=score;
  document.querySelector('#msg').style.display='grid';
}

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);

  if(!gameOver){
    attackCooldown=Math.max(0,attackCooldown-dt);

    let mx=input.x;
    let mz=input.y;

    if(keys['arrowleft']||keys['a'])mx=-1;
    if(keys['arrowright']||keys['d'])mx=1;
    if(keys['arrowup']||keys['w'])mz=-1;
    if(keys['arrowdown']||keys['s'])mz=1;

    const length=Math.hypot(mx,mz);
    if(length>1){mx/=length;mz/=length}

    player.position.x+=mx*6*dt;
    player.position.z+=mz*6*dt;

    player.position.x=THREE.MathUtils.clamp(
      player.position.x,-65,65);
    player.position.z=THREE.MathUtils.clamp(
      player.position.z,-65,65);

    if(Math.abs(mx)+Math.abs(mz)>.05)
      player.rotation.y=Math.atan2(mx,mz);

    for(const z of zombies){
      const dx=player.position.x-z.mesh.position.x;
      const dz=player.position.z-z.mesh.position.z;
      const dist=Math.hypot(dx,dz);

      if(dist>1.35){
        z.mesh.position.x+=dx/dist*.85*dt;
        z.mesh.position.z+=dz/dist*.85*dt;
        z.mesh.rotation.y=Math.atan2(dx,dz);
      }else{
        z.attackTimer-=dt;
        if(z.attackTimer<=0){
          health=Math.max(0,health-5);
          healthEl.textContent=health;
          z.attackTimer=1;
          if(health<=0)endGame();
        }
      }
    }
  }

  target.set(
    player.position.x,
    player.position.y+1,
    player.position.z
  );

  camera.position.lerp(
    new THREE.Vector3(
      player.position.x,
      player.position.y+7,
      player.position.z+10
    ),.08
  );
  camera.lookAt(target);

  renderer.render(scene,camera);
}

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

animate();
</script>
</body>
</html>
